# Ultralytics YOLO26-HierLight - YOLO26 backbone + HierLight HEPAN neck
# Combines YOLO26 C3k2/C2PSA backbone with HierLight-YOLO's HEPAN neck:
#   - HFCC: 1x1 channel compression on all backbone outputs
#   - Top-down pathway with C3k2 fusion
#   - Bottom-up pathway with IRDCB lightweight blocks and dense skip connections
#   - Dedicated P2 small-object detection head
# Paper: https://arxiv.org/abs/2509.22365

# Parameters
nc: [80]
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone (same as yolo26-p2)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]           # 2
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]           # 4
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                  # 6
  - [-1, 1, LDown, [1024, 3, 2]]                # 7-P5/32 (lightweight downsample)
  - [-1, 1, SPPF, [1024, 5, 3, True]]           # 8
  - [-1, 2, C2PSA, [1024]]                      # 9

# HEPAN Head (Hierarchical Extended Path Aggregation Network)
head:
  # ===== HFCC: Hierarchical Feature Channel Compression =====
  - [2, 1, Conv, [64, 1, 1]]                    # 10 - P2 compressed
  - [4, 1, Conv, [128, 1, 1]]                   # 11 - P3 compressed
  - [6, 1, Conv, [256, 1, 1]]                   # 12 - P4 compressed
  - [9, 1, Conv, [512, 1, 1]]                   # 13 - P5 compressed

  # ===== Top-down pathway: P5 -> P4 -> P3 -> P2 =====
  - [13, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 12], 1, Concat, [1]]                  # 15 - P5up + P4_comp
  - [-1, 2, C3k2, [256, True]]                  # 16 - N4

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 11], 1, Concat, [1]]                  # 18 - N4up + P3_comp
  - [-1, 2, C3k2, [128, True]]                  # 19 - N3

  - [19, 1, nn.Upsample, [None, 2, "nearest"]]  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21 - N3up + P2_comp
  - [-1, 2, C3k2, [64, True]]                   # 22 - N2

  # ===== Bottom-up pathway with IRDCB + dense skips =====
  # N2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                  # 23 - Downsample N2
  - [[-1, 19], 1, Concat, [1]]                  # 24 - N2down + N3
  - [-1, 2, IRDCB, [128, 2]]                    # 25 - P3_out

  # P3 -> P4 with dense skip from N2
  - [-1, 1, Conv, [256, 3, 2]]                  # 26 - Downsample P3_out
  - [22, 1, Conv, [64, 3, 4]]                   # 27 - N2 skip to P4 scale
  - [[26, 16, 27], 1, Concat, [1]]              # 28 - P3down + N4 + N2skip
  - [-1, 2, IRDCB, [256, 2]]                    # 29 - P4_out

  # P4 -> P5 with dense skip from N3
  - [-1, 1, Conv, [512, 3, 2]]                  # 30 - Downsample P4_out
  - [19, 1, Conv, [128, 3, 4]]                  # 31 - N3 skip to P5 scale
  - [[30, 13, 31], 1, Concat, [1]]              # 32 - P4down + P5_comp + N3skip
  - [-1, 1, C3k2, [1024, True, 0.5, True]]      # 33 - P5_out

  # ===== Small Object Detection Head (P2) =====
  - [25, 1, nn.Upsample, [None, 2, "nearest"]]  # 34 - Upsample P3_out to P2 scale
  - [[-1, 2], 1, Concat, [1]]                   # 35 - P3up + P2_backbone
  - [-1, 2, C3k2, [128, True]]                  # 36 - P2_small

  # Detect on [P2_small, P3_out, P4_out, P5_out]
  - [[36, 25, 29, 33], 1, Detect, [nc]]
